dynnav_planner_bridge:
  ros__parameters:
    grid_width: 10
    grid_height: 10
    start: "0:0"
    goal: "9:9"
    obstacles: "3:3,3:4,3:5,4:5,5:5"
    resolution_m: 1.0
    frame_id: "map"
    publish_period_s: 1.0

    # `self_aware` preserves the existing bridge behavior. Set to
    # `history_aware` to plan over position plus retained activated hazards.
    planner_mode: "self_aware"
    safe_cells: "0:0"
    # Semicolon-separated: trigger@closure@probability
    # Example: "1:1>2:1@0:1@0.8;3:1>4:1@2:1@0.5"
    commitment_hazards: ""
    recoverability_weight: 4.0
    max_hazard_cells: 16
