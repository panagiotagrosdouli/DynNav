name: Geometric held-out evidence

on:
  push:
    branches:
      - research/geometric-heldout
    paths:
      - dynnav/experiments/geometric_heldout_benchmark.py
      - tests/test_geometric_heldout_benchmark.py
      - scripts/run_geometric_heldout_benchmark.py
      - .github/workflows/geometric-heldout-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,researcher]"
      - name: Run frozen geometric regressions
        run: python -m pytest -q tests/test_geometric_heldout_benchmark.py --tb=short
      - name: Run 500-seed frozen geometric evaluation
        run: >-
          python scripts/run_geometric_heldout_benchmark.py
          --seeds 500
          --recoverability-weight 8.0
          --output-dir results/geometric_heldout
      - name: Upload retained geometric evidence
        uses: actions/upload-artifact@v4
        with:
          name: geometric-heldout-evidence-${{ github.sha }}
          path: results/geometric_heldout
          if-no-files-found: error
