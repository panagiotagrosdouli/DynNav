name: Web portal

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "apps/web/**"
      - "scripts/build_web_portal.sh"
      - "vercel.json"
      - ".github/workflows/web-portal.yml"
  pull_request:
    paths:
      - "website/**"
      - "apps/web/**"
      - "scripts/build_web_portal.sh"
      - "vercel.json"
      - ".github/workflows/web-portal.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build both web interfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched dependency graphs
        run: |
          npm --prefix website install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: |
          npm --prefix website ci --no-audit --no-fund
          npm --prefix apps/web ci --no-audit --no-fund
      - name: Audit dependency trees
        run: |
          npm --prefix website audit --audit-level=high
          npm --prefix apps/web audit --audit-level=high
      - name: Build combined portal
        env:
          DYNNAV_SITE_BASE_PATH: /DynNav
        run: bash scripts/build_web_portal.sh
      - name: Verify both entry points
        run: |
          test -s .web-dist/index.html
          test -s .web-dist/researcher/index.html
          test -f .web-dist/.nojekyll
          grep -q '/DynNav/_next/' .web-dist/index.html
          grep -q '/DynNav/researcher/_next/' .web-dist/researcher/index.html
      - name: Upload deployment-ready portal
        uses: actions/upload-artifact@v4
        with:
          name: dynnav-web-portal
          path: .web-dist
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .web-dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
