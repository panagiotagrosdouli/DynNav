name: Ruff import diagnostic

on:
  pull_request:
    paths:
      - "dynnav/experiments/heldout_history_generalization.py"
      - ".github/workflows/ruff-import-diagnostic.yml"
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.5.7
      - name: Print canonical Ruff import fix
        run: |
          ruff check --select I001 --fix dynnav/experiments/heldout_history_generalization.py
          git diff -- dynnav/experiments/heldout_history_generalization.py
