name: Freeze V4 scenario manifests

on:
  push:
    branches:
      - research/belief-conditioned-v4
    paths:
      - "dynnav/experiments/v4_scenario_manifest.py"
      - "scripts/freeze_v4_manifests.py"
      - "tests/test_v4_scenario_manifest.py"
      - ".github/workflows/freeze-v4-manifests.yml"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/belief-conditioned-v4
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate generator contracts
        run: |
          python -m pytest -q \
            tests/test_v4_scenario_manifest.py \
            tests/test_v4_hierarchical_statistics.py

      - name: Generate explicit manifests
        run: |
          python scripts/freeze_v4_manifests.py
          sha256sum benchmarks/v4/development.json \
                    benchmarks/v4/validation.json \
                    benchmarks/v4/heldout.json \
                    > benchmarks/v4/SHA256SUMS.txt

      - name: Commit frozen manifests if changed
        run: |
          if git diff --quiet -- benchmarks/v4; then
            echo "V4 manifests already frozen at this generator state."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/v4
          git commit -m "research: freeze explicit V4 scenario manifests"
          git push origin HEAD:research/belief-conditioned-v4
