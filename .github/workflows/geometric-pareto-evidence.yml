name: Geometric Pareto evidence

on:
  push:
    branches:
      - research/geometric-pareto
    paths:
      - paper/dynnav_r/GEOMETRIC_PARETO_PROTOCOL.md
      - dynnav/experiments/geometric_pareto_benchmark.py
      - tests/test_geometric_pareto_benchmark.py
      - scripts/run_geometric_pareto_benchmark.py
      - .github/workflows/geometric-pareto-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,researcher]"
      - name: Run Pareto protocol regressions
        run: python -m pytest -q tests/test_geometric_pareto_benchmark.py --tb=short
      - name: Run full frozen Pareto sweep
        run: >-
          python scripts/run_geometric_pareto_benchmark.py
          --seeds 500
          --output-dir results/geometric_pareto
      - name: Upload retained Pareto evidence
        uses: actions/upload-artifact@v4
        with:
          name: geometric-pareto-evidence-${{ github.sha }}
          path: results/geometric_pareto
          if-no-files-found: error
