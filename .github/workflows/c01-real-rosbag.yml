name: C01 real recorded robot ROS bag audit

on:
  pull_request:
    paths:
      - "contributions/01_learned_astar/**"
      - ".github/workflows/c01-real-rosbag.yml"
  workflow_dispatch:

jobs:
  real-recorded-rosbag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ROS bag decoder
        run: python -m pip install "rosbags>=0.10,<0.11"
      - name: Download original physical Dingo recording (ROS 1 bag)
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import urllib.request
          url = "https://www.ipb.uni-bonn.de/html/projects/localization_benchmark/data/bagfiles_no_cams/dynamics_0.bag"
          out = pathlib.Path("/tmp/c01-dingo-dynamics_0.bag")
          with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "DynNav-C01-scientific-reproducibility"}), timeout=180) as stream, out.open("wb") as sink:
              import shutil
              shutil.copyfileobj(stream, sink)
          print(f"downloaded bytes={out.stat().st_size}")
          if not 10_000_000 < out.stat().st_size < 100_000_000:
              raise RuntimeError("unexpected downloaded dataset size")
          print("original ROS1 bag sha256=" + hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Decode actual recorded LiDAR, odometry and TF messages
        run: |
          python contributions/01_learned_astar/experiments/inspect_recorded_rosbag.py             /tmp/c01-dingo-dynamics_0.bag             --output results/c01_real_rosbag/dynamics_0_recorded_messages.json
      - name: Verify raw decoded real-sensor evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("results/c01_real_rosbag/dynamics_0_recorded_messages.json")
          data = json.loads(p.read_text())
          assert data["decoded_message_count_total"] > 0
          assert any("LaserScan" in s["type"] and s["decoded_message_count"] > 0 for s in data["topic_statistics"]), data["topic_statistics"]
          assert any("Odometry" in s["type"] and s["decoded_message_count"] > 0 for s in data["topic_statistics"]), data["topic_statistics"]
          assert data["physical_robot_validation"] is False
          assert data["c01_controlled_source_robot"] is False
          print("Real recorded sensor messages decoded. Original robot DID NOT run C01.")
          PY
      - name: Upload measured sensor inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c01-real-dingo-recorded-rosbag-inspection
          path: results/c01_real_rosbag/
          if-no-files-found: warn

  ros2-jazzy-real-recording-replay:
    needs: real-recorded-rosbag
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install actual ROS 2 runtime and conversion tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip python3-venv \
            ros-jazzy-ros2bag ros-jazzy-rosbag2-transport \
            ros-jazzy-rosbag2-storage-default-plugins \
            ros-jazzy-nav-msgs ros-jazzy-sensor-msgs ros-jazzy-tf2-msgs \
            python3-numpy python3-matplotlib python3-yaml python3-pil
          python3 -m venv --system-site-packages /tmp/c01-ros-venv
          /tmp/c01-ros-venv/bin/pip install "rosbags>=0.10,<0.11"
      - name: Download official real Dingo sensor bag again
        run: |
          /tmp/c01-ros-venv/bin/python - <<'PY'
          import pathlib
          import urllib.request
          import shutil
          url = "https://www.ipb.uni-bonn.de/html/projects/localization_benchmark/data/bagfiles_no_cams/dynamics_0.bag"
          out = pathlib.Path("/tmp/c01-dingo-dynamics_0.bag")
          with urllib.request.urlopen(url, timeout=180) as src, out.open("wb") as dst:
              shutil.copyfileobj(src, dst)
          if out.stat().st_size != 38063988:
              raise RuntimeError("Official Dingo bag file size unexpectedly changed")
          PY
      - name: Convert actual ROS 1 sensor recording into ROS 2 bag
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/c01-ros-venv/bin/activate
          rosbags-convert --src /tmp/c01-dingo-dynamics_0.bag --dst /tmp/c01-dingo-ros2-bag
          ros2 bag info /tmp/c01-dingo-ros2-bag
      - name: Actually replay ROS 2 bag and receive recorded LiDAR and odometry messages
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source /tmp/c01-ros-venv/bin/activate
          python contributions/01_learned_astar/experiments/ros2_verify_recorded_replay.py \
            --seconds 40 \
            --output results/c01_real_rosbag/ros2_jazzy_recorded_replay.json &
          OBSERVER_PID=$!
          sleep 3
          timeout 50 ros2 bag play /tmp/c01-dingo-ros2-bag --rate 30 &
          PLAYER_PID=$!
          wait "$OBSERVER_PID"
          kill "$PLAYER_PID" 2>/dev/null || true
          wait "$PLAYER_PID" 2>/dev/null || true
      - name: Actually exercise the C01 GetPlan service inside ROS 2 Jazzy
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source /tmp/c01-ros-venv/bin/activate
          python contributions/01_learned_astar/experiments/ros2_get_plan_node.py \
            --ros-args -p mode:=astar_manhattan -p map_topic:=/c01/test_grid &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python contributions/01_learned_astar/experiments/ros2_get_plan_roundtrip_test.py \
            --output results/c01_real_rosbag/c01_ros2_get_plan_roundtrip.json
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Install CPU PyTorch for actual C01 saved neural checkpoint
        run: |
          source /tmp/c01-ros-venv/bin/activate
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Actually exercise raw and clipped learned C01 GetPlan service on ROS2 Jazzy
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source /tmp/c01-ros-venv/bin/activate
          MODEL="$PWD/contributions/01_learned_astar/models/heuristic_net_rich.pt"
          for MODE in learned_raw learned_manhattan_clipped; do
            python contributions/01_learned_astar/experiments/ros2_get_plan_node.py \
              --ros-args -p mode:="$MODE" -p map_topic:=/c01/test_grid -p checkpoint:="$MODEL" &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            python contributions/01_learned_astar/experiments/ros2_get_plan_roundtrip_test.py \
              --expected-mode "$MODE" \
              --output "results/c01_real_rosbag/c01_ros2_${MODE}_roundtrip.json"
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            trap - EXIT
            sleep 1
          done

      - name: Acquire the official physical-world LILocBench occupancy map
        run: |
          source /tmp/c01-ros-venv/bin/activate
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          import zipfile
          import yaml
          root = Path("/tmp/c01_official_map")
          root.mkdir(parents=True, exist_ok=True)
          url = "https://www.ipb.uni-bonn.de/html/projects/localization_benchmark/data/map_office.zip"
          archive = root / "official_office_map.zip"
          with urllib.request.urlopen(url, timeout=90) as src, archive.open("wb") as dst:
              import shutil
              shutil.copyfileobj(src,dst)
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if not (root / entry.filename).resolve().is_relative_to(root.resolve()):
                      raise ValueError("unsafe original-map archive entry")
              z.extractall(root)
          valid = []
          for candidate in root.rglob("*.yaml"):
              metadata = yaml.safe_load(candidate.read_text(encoding="utf-8"))
              if isinstance(metadata,dict) and isinstance(metadata.get("image"),str):
                  if (candidate.parent / metadata["image"]).is_file():
                      valid.append(candidate)
          if len(valid)!=1:
              raise RuntimeError(f"expected one original map YAML; found {valid}")
          Path("/tmp/c01-official-map-yaml").write_text(str(valid[0]),encoding="utf-8")
          print("Official original ROS occupancy map: "+str(valid[0]))
          PY
      - name: Execute genuine ROS2 C01 planner on recorded-world office occupancy map
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          source /tmp/c01-ros-venv/bin/activate
          MODEL="$PWD/contributions/01_learned_astar/models/heuristic_net_rich.pt"
          MAP_YAML="$(cat /tmp/c01-official-map-yaml)"
          for MODE in astar_manhattan learned_raw; do
            python contributions/01_learned_astar/experiments/ros2_get_plan_node.py \
              --ros-args -p mode:="$MODE" -p map_topic:=/c01/test_grid -p checkpoint:="$MODEL" &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            python contributions/01_learned_astar/experiments/ros2_get_plan_roundtrip_test.py \
              --ros-map-yaml "$MAP_YAML" \
              --expected-mode "$MODE" \
              --output "results/c01_real_rosbag/c01_ros2_real_map_${MODE}.json"
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            trap - EXIT
            sleep 1
          done

      - name: Upload ROS2 real-recording replay report (not raw bag)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c01-ros2-jazzy-real-dingo-recording-replay
          path: results/c01_real_rosbag/
          if-no-files-found: warn
