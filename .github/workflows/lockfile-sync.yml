name: One-shot lockfile sync

on:
  push:
    branches:
      - fix/vercel-gazebo-startup-race
    paths:
      - ".github/workflows/lockfile-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate exact npm lockfiles
        run: |
          npm --prefix website install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix apps/web install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix vercel_app install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package-lock.json apps/web/package-lock.json vercel_app/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized."
            exit 0
          fi
          git commit -m "chore(web): synchronize npm lockfiles"
          git push origin HEAD:${GITHUB_REF_NAME}
