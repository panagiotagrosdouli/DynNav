name: ROS 2 dynamic route-invalidation benchmark

on:
  push:
    branches:
      - validation/gazebo-dynamic
    paths:
      - '.github/workflows/ros2-dynamic.yml'
      - 'ros2_ws/src/dynnav_nav2_cpp/**'
      - 'ros2_ws/src/dynnav_nav2_benchmark/**'
  workflow_dispatch:
    inputs:
      repetitions:
        description: Measured repetitions per scenario and planner
        required: true
        default: "1"

jobs:
  dynamic-gazebo-harmonic:
    name: Jazzy / Gazebo Harmonic / frozen obstacle events
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container: ros:jazzy-ros-base-noble
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS and simulation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-jazzy-rosbag2 \
            ros-jazzy-rosbag2-storage-default-plugins
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install \
            --from-paths \
              ros2_ws/src/dynnav_nav2_cpp \
              ros2_ws/src/dynnav_nav2_benchmark \
            --ignore-src \
            --rosdistro jazzy \
            -r -y

      - name: Verify real ROS and Gazebo runtime
        run: |
          source /opt/ros/jazzy/setup.bash
          echo "ROS_DISTRO=$ROS_DISTRO"
          test "$ROS_DISTRO" = "jazzy"
          ros2 --help >/dev/null
          ros2 bag --help >/dev/null
          gz sim --versions

      - name: Build and test experiment packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base /tmp/dynnav_dynamic/log build \
            --base-paths \
              ros2_ws/src/dynnav_nav2_cpp \
              ros2_ws/src/dynnav_nav2_benchmark \
            --build-base /tmp/dynnav_dynamic/build \
            --install-base /tmp/dynnav_dynamic/install \
            --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark \
            --event-handlers console_direct+
          source /tmp/dynnav_dynamic/install/setup.bash
          colcon --log-base /tmp/dynnav_dynamic/test-log test \
            --build-base /tmp/dynnav_dynamic/build \
            --install-base /tmp/dynnav_dynamic/install \
            --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark \
            --event-handlers console_direct+
          colcon test-result \
            --test-result-base /tmp/dynnav_dynamic/build \
            --verbose

      - name: Record installed environment
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/dynnav_dynamic/results
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 'ros-jazzy-*' \
            | sort > /tmp/dynnav_dynamic/results/ros_packages.tsv
          uname -a > /tmp/dynnav_dynamic/results/kernel.txt
          gz sim --versions > /tmp/dynnav_dynamic/results/gazebo_versions.txt

      - name: Run frozen dynamic trials
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_dynamic/install/setup.bash
          timeout --signal=INT --kill-after=30s 55m \
            ros2 launch dynnav_nav2_benchmark \
              tb3_dynamic_execution_benchmark.launch.py \
              headless:=true \
              record_bag:=true \
              repetitions:=${{ inputs.repetitions || '1' }} \
              output_dir:=/tmp/dynnav_dynamic/results \
            2>&1 | tee /tmp/dynnav_dynamic/results/ros_launch.log
          test -s /tmp/dynnav_dynamic/results/results.json
          test -s /tmp/dynnav_dynamic/results/trials.csv
          test -s /tmp/dynnav_dynamic/results/blocker_snapshot.sdf
          test -s /tmp/dynnav_dynamic/results/run_manifest.json
          test -s /tmp/dynnav_dynamic/results/ros_launch.log
          test -s /tmp/dynnav_dynamic/results/rosbag2/metadata.yaml

      - name: Validate dynamic result contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = Path("/tmp/dynnav_dynamic/results")
          result = json.loads((output / "results.json").read_text())
          repetitions = int("${{ inputs.repetitions || '1' }}")
          assert result["schema_version"] == 1
          assert result["status"] == "completed"
          assert result["benchmark_type"] == (
              "dynamic_navigate_to_pose_route_invalidation"
          )
          assert len(result["trials"]) == repetitions * 2 * 6
          assert len(result["summary"]) == 6
          assert result["source_revision"] != "unrecorded"
          assert all(row["valid_trial"] for row in result["trials"])
          forward_requirements = {
              item["name"]: item["event"].get(
                  "require_forward_path_invalidation", True
              )
              for item in result["scenarios"]
          }
          assert all(
              not (
                  row["event_applied"]
                  and forward_requirements[row["scenario"]]
              )
              or row["pre_event_path_invalidated"] is True
              for row in result["trials"]
          )
          assert all(
              row["planner_path_count"] >= 1
              for row in result["trials"]
              if row["event_applied"]
          )
          assessed = sum(
              row["recovery_assessment"] is not None for row in result["trials"]
          )
          assert len(list(output.glob("costmap_*.json.gz"))) == assessed
          assert all(
              row["operational_irreversibility_assessed"] > 0
              for row in result["summary"].values()
          )
          print(json.dumps(result["summary"], indent=2, sort_keys=True))
          PY

      - name: Upload raw dynamic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynnav-jazzy-gazebo-dynamic-route-invalidation
          path: /tmp/dynnav_dynamic/results
          if-no-files-found: warn
