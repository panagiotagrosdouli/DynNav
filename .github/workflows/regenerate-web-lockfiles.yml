name: Regenerate web lockfiles

on:
  push:
    branches:
      - fix/web-security-audit
    paths:
      - .github/workflows/regenerate-web-lockfiles.yml
      - website/package.json
      - apps/web/package.json

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate website lockfile
        run: npm --prefix website install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Regenerate researcher lockfile
        run: npm --prefix apps/web install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean audit after install
        run: |
          npm --prefix website audit --audit-level=high
          npm --prefix apps/web audit --audit-level=high
      - name: Upload regenerated lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-web-lockfiles
          path: |
            website/package-lock.json
            apps/web/package-lock.json
          if-no-files-found: error
