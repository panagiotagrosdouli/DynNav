name: Correlated history Gazebo V2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/correlated-history-gazebo-v2.yml"
      - "G1_CORRELATED_GAZEBO_V2_PROTOCOL.md"
      - "ros2_ws/src/dynnav_nav2_cpp/**"
      - "ros2_ws/src/dynnav_nav2_benchmark/**"
  workflow_dispatch:
    inputs:
      repetitions:
        description: Paired repetitions per dependence condition
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correlated-history-gazebo:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ros:jazzy-ros-base-noble
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS and Gazebo dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install             --from-paths ros2_ws/src/dynnav_nav2_cpp ros2_ws/src/dynnav_nav2_benchmark             --ignore-src --rosdistro jazzy -r -y

      - name: Build and test robust history stack
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base /tmp/dynnav_corr/log build             --base-paths ros2_ws/src/dynnav_nav2_cpp ros2_ws/src/dynnav_nav2_benchmark             --build-base /tmp/dynnav_corr/build             --install-base /tmp/dynnav_corr/install             --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark             --event-handlers console_direct+
          source /tmp/dynnav_corr/install/setup.bash
          colcon --log-base /tmp/dynnav_corr/test-log test             --build-base /tmp/dynnav_corr/build             --install-base /tmp/dynnav_corr/install             --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark             --event-handlers console_direct+
          colcon test-result --test-result-base /tmp/dynnav_corr/build --verbose

      - name: Certify frozen topology and record provenance
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_corr/install/setup.bash
          mkdir -p /tmp/dynnav_corr/results
          python3 - <<'PY'
          import json
          from pathlib import Path
          from dynnav_nav2_benchmark.canonical_g1_contract import evaluate_canonical_g1_topology

          root = Path("ros2_ws/src/dynnav_nav2_benchmark")
          contract = evaluate_canonical_g1_topology(
              map_yaml=root / "maps" / "g1_parallel_corridor.yaml",
              scenario_yaml=root / "config" / "sandbox_correlated_history_events.yaml",
          )
          payload = contract.to_dict()
          assert [payload["f00"], payload["f10"], payload["f01"], payload["f11"]] == [1, 1, 1, 0]
          assert payload["interaction"] == -1
          Path("/tmp/dynnav_corr/results/topology_contract.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True)
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          cp G1_CORRELATED_GAZEBO_V2_PROTOCOL.md /tmp/dynnav_corr/results/
          cp ros2_ws/src/dynnav_nav2_benchmark/config/sandbox_correlated_history_events.yaml /tmp/dynnav_corr/results/frozen_scenario.yaml
          cp ros2_ws/src/dynnav_nav2_benchmark/maps/g1_parallel_corridor.yaml /tmp/dynnav_corr/results/
          cp ros2_ws/src/dynnav_nav2_benchmark/maps/g1_parallel_corridor.pgm /tmp/dynnav_corr/results/
          cp ros2_ws/src/dynnav_nav2_benchmark/worlds/g1_parallel_corridor.sdf.xacro /tmp/dynnav_corr/results/
          cp ros2_ws/src/dynnav_nav2_benchmark/models/g1_parallel_corridor_blocker.sdf /tmp/dynnav_corr/results/
          printf '%s\n' "${GITHUB_SHA}" > /tmp/dynnav_corr/results/source_revision.txt
          sha256sum             G1_CORRELATED_GAZEBO_V2_PROTOCOL.md             ros2_ws/src/dynnav_nav2_benchmark/config/sandbox_correlated_history_events.yaml             ros2_ws/src/dynnav_nav2_benchmark/maps/g1_parallel_corridor.yaml             ros2_ws/src/dynnav_nav2_benchmark/maps/g1_parallel_corridor.pgm             ros2_ws/src/dynnav_nav2_benchmark/worlds/g1_parallel_corridor.sdf.xacro             ros2_ws/src/dynnav_nav2_benchmark/models/g1_parallel_corridor_blocker.sdf             > /tmp/dynnav_corr/results/FROZEN_SHA256SUMS

      - name: Run preregistered correlated execution smoke
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_corr/install/setup.bash
          timeout --signal=INT --kill-after=30s 50m             ros2 launch dynnav_nav2_benchmark             tb3_correlated_history_execution_benchmark.launch.py             headless:=true             repetitions:=${{ inputs.repetitions || '1' }}             output_dir:=/tmp/dynnav_corr/results             2>&1 | tee /tmp/dynnav_corr/results/ros_launch.log
          test -s /tmp/dynnav_corr/results/results.json

      - name: Validate paired dependence contract
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          path = Path("/tmp/dynnav_corr/results/results.json")
          data = json.loads(path.read_text())
          assert data["schema_version"] == 1
          assert data["benchmark_type"] == "correlated_action_triggered_history"
          repetitions = int("${{ inputs.repetitions || '1' }}")
          planners = {"DynNavShortest", "DynNavHistory", "DynNavRobustHistory"}
          conditions = {"independent", "common_cause", "anti_correlated"}
          trials = data["trials"]
          assert len(trials) == repetitions * len(planners) * len(conditions)

          grouped = defaultdict(list)
          for row in trials:
              assert row["valid_trial"]
              assert row["dependence"] in conditions
              assert row["planner_id"] in planners
              assert len(row["latent_closures"]) == 2
              assert len(row["hazards"]) == 2
              grouped[(row["dependence"], row["repetition"])].append(row)

          for (dependence, repetition), rows in grouped.items():
              assert {row["planner_id"] for row in rows} == planners
              latent = {tuple(row["latent_closures"]) for row in rows}
              assert len(latent) == 1
              pair = next(iter(latent))
              if dependence == "common_cause":
                  assert pair[0] == pair[1]
              if dependence == "anti_correlated":
                  assert pair[0] != pair[1]

          summary = {}
          for dependence in sorted(conditions):
              summary[dependence] = {}
              for planner in sorted(planners):
                  rows = [
                      row for row in trials
                      if row["dependence"] == dependence and row["planner_id"] == planner
                  ]
                  summary[dependence][planner] = {
                      "trials": len(rows),
                      "triggered_hazard_events": sum(
                          sum(bool(h["trigger_observed"]) for h in row["hazards"])
                          for row in rows
                      ),
                      "closures_applied": sum(
                          sum(bool(value) for value in row["closures_applied"])
                          for row in rows
                      ),
                      "navigation_successes": sum(bool(row["navigation_success"]) for row in rows),
                      "irreversible_failures": sum(
                          bool(row["operational_irreversible_failure"]) for row in rows
                      ),
                  }
          Path("/tmp/dynnav_corr/results/audit_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True)
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload correlated Gazebo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynnav-correlated-gazebo-v2-${{ github.sha }}
          path: /tmp/dynnav_corr/results
          if-no-files-found: warn
