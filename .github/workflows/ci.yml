name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,researcher]"

      - name: Verify canonical package layout
        run: |
          python - <<'PY'
          from pathlib import Path

          import dynnav
          import dynnav.experiments
          import dynnav.mapping
          import dynnav.researcher

          package = Path(dynnav.__file__).resolve()
          expected = Path.cwd().resolve() / "dynnav"
          assert package.is_relative_to(expected), (package, expected)
          print(f"canonical dynnav package: {package}")
          PY

      - name: Lint canonical Python package
        run: >-
          ruff check
          dynnav
          ros2_ws/src/dynnav_nav2_benchmark

      - name: Type-check mapping core
        run: >-
          mypy dynnav/mapping
          --strict
          --no-warn-unused-ignores
          --show-error-codes

      - name: Unified regression suite
        run: python -m pytest -q --tb=short

      - name: Reproducibility smoke tests
        if: matrix.python-version == '3.12'
        run: python scripts/run_all.py --config configs/default.yaml --smoke --out-dir results/ci_smoke

      - name: Benchmark smoke test
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/run_benchmarks.py
          --config configs/default.yaml
          --smoke
          --out-dir results/ci_benchmarks

  ros2-jazzy:
    name: ROS 2 Jazzy / Nav2 plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install \
            --from-paths ros2_ws/src/dynnav_nav2_cpp \
            --ignore-src \
            --rosdistro jazzy \
            -r -y

      - name: Build Nav2 plugin
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base /tmp/dynnav_ros2/log build \
            --base-paths ros2_ws/src/dynnav_nav2_cpp \
            --build-base /tmp/dynnav_ros2/build \
            --install-base /tmp/dynnav_ros2/install \
            --packages-select dynnav_nav2_cpp \
            --event-handlers console_direct+

      - name: Test path search and plugin discovery
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_ros2/install/setup.bash
          colcon --log-base /tmp/dynnav_ros2/test-log test \
            --build-base /tmp/dynnav_ros2/build \
            --install-base /tmp/dynnav_ros2/install \
            --packages-select dynnav_nav2_cpp \
            --event-handlers console_direct+
          colcon test-result \
            --test-result-base /tmp/dynnav_ros2/build \
            --verbose

      - name: Verify installed package and configuration
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_ros2/install/setup.bash
          ros2 pkg prefix dynnav_nav2_cpp
          test -f /tmp/dynnav_ros2/install/dynnav_nav2_cpp/share/dynnav_nav2_cpp/config/nav2_params.yaml

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched website dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install website dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit website dependencies
        run: npm audit --audit-level=high
      - name: Type-check website
        run: npm run typecheck
      - name: Build website
        run: npm run build

  researcher-web:
    name: Researcher web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched researcher dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install researcher web dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit researcher dependencies
        run: npm audit --audit-level=high
      - name: Type-check researcher workspace
        run: npm run typecheck
      - name: Build researcher workspace
        run: npm run build

  markdown:
    name: Markdown inventory and local links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit every Markdown file
        run: python scripts/audit_markdown.py --root . --json-out results/markdown_audit.json
      - name: Upload Markdown audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-audit
          path: results/markdown_audit.json
          if-no-files-found: error
