name: C02 independent uncertainty calibration deep validation

on:
  pull_request:
    paths:
      - "contributions/02_uncertainty_calibration/**"
      - ".github/workflows/c02-deep-validation.yml"
  workflow_dispatch:

jobs:
  c02-heldout-map-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install calibration dependencies and genuine checkpoint reader
        run: |
          python -m pip install numpy pandas pytest pillow pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute C02 source, dataset and checkpoint integrity audit
        run: |
          python scripts/audit_contributions_c02_c26.py \
            --only C02 --output-dir results/c02_deep_validation/inventory
      - name: Execute every C02 focused test
        run: |
          python -m pytest -q contributions/02_uncertainty_calibration/tests
      - name: Actually retrain C02 neural drift uncertainty on archived synthetic data
        run: |
          python contributions/02_uncertainty_calibration/code/train_drift_uncertainty_net.py \
            --csv contributions/02_uncertainty_calibration/results/drift_dataset.csv \
            --model-out results/c02_deep_validation/c02_retrained_2epochs.pt \
            --stats-out results/c02_deep_validation/c02_trainonly_norm.npz \
            --epochs 2 --seed 2026
          python - <<'PY'
          import torch
          import numpy as np
          from pathlib import Path
          root=Path("results/c02_deep_validation")
          state=torch.load(root/"c02_retrained_2epochs.pt",map_location="cpu",weights_only=True)
          assert state["input_dim"]==3
          assert all(torch.isfinite(x).all() for x in state["model_state_dict"].values())
          with np.load(root/"c02_trainonly_norm.npz",allow_pickle=False) as d:
              assert np.all(np.isfinite(d["x_mean"]))
              assert np.all(d["x_std"]>0)
          print("C02 trained two epochs with train-only normalizer and non-destructive model outputs")
          PY
      - name: Execute original C02 calibrated-vs-raw baseline
        run: |
          python contributions/02_uncertainty_calibration/experiments/eval_uncertainty_calibration.py \
            --n 2000 --seed 13 \
            --out results/c02_deep_validation/original_synthetic_calibration.csv
      - name: Execute existing archived C02 group-separated experiment
        run: |
          python contributions/02_uncertainty_calibration/experiments/eval_archived_instance_holdout.py \
            --out results/c02_deep_validation/archived_group_holdout.json
      - name: Independently fit, calibrate and evaluate across disjoint map groups
        run: |
          python contributions/02_uncertainty_calibration/experiments/eval_three_way_group_coverage.py \
            --alpha 0.1 --seeds 10 \
            --output results/c02_deep_validation/three_way_10_seeds.json
      - name: Require evidence provenance and non-overlapping map IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/c02_deep_validation/three_way_10_seeds.json")
          doc=json.loads(p.read_text())
          assert len(doc["trials"])==10
          assert doc["physical_robot_trials"]==0
          assert len(doc["source_sha256"])==64
          assert doc["nominal_coverage"]==0.9
          for trial in doc["trials"]:
              a,b,c=map(set,(trial["fit_map_ids"],trial["calibration_map_ids"],trial["test_map_ids"]))
              assert a and b and c and a.isdisjoint(b) and b.isdisjoint(c) and a.isdisjoint(c)
              for method in trial["methods"].values():
                  assert method["n_calibration_states"]>0 and method["n_test_states"]>0
                  assert 0<=method["empirical_state_coverage"]<=1
          print("C02 10 independent group partitions passed scientific provenance checks")
          PY
      - name: Upload independent C02 research evidence and archive hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c02-three-way-map-calibration-and-all-source-validation
          path: results/c02_deep_validation/
          if-no-files-found: warn
