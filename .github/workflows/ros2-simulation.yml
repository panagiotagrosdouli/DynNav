name: ROS 2 Gazebo benchmark

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Measured repetitions per scenario and planner
        required: true
        default: "3"

jobs:
  gazebo-harmonic:
    name: Jazzy / Gazebo Harmonic / minimal TB3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ros:jazzy-ros-base-noble
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS and simulation dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/dynnav_gazebo/setup
          # Retain repository/candidate diagnostics even if dependency setup fails.
          cat /etc/os-release > /tmp/dynnav_gazebo/setup/os-release.txt
          cp -a /etc/apt/sources.list.d /tmp/dynnav_gazebo/setup/apt-sources
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' \
            > /etc/apt/apt.conf.d/80dynnav-retries
          apt-get update -o APT::Update::Error-Mode=any
          apt-cache policy ros-jazzy-nav2-bringup \
            > /tmp/dynnav_gazebo/setup/nav2-candidate.txt
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-jazzy-slam-toolbox
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            rosdep init
          fi
          rosdep update
          rosdep install \
            --from-paths \
              ros2_ws/src/dynnav_nav2_cpp \
              ros2_ws/src/dynnav_nav2_benchmark \
            --ignore-src \
            --rosdistro jazzy \
            -r -y 2>&1 | tee /tmp/dynnav_gazebo/setup/rosdep-install.log

      - name: Upload dependency setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynnav-jazzy-gazebo-setup
          path: /tmp/dynnav_gazebo/setup
          if-no-files-found: error

      - name: Build planner and benchmark packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon --log-base /tmp/dynnav_gazebo/log build \
            --base-paths \
              ros2_ws/src/dynnav_nav2_cpp \
              ros2_ws/src/dynnav_nav2_benchmark \
            --build-base /tmp/dynnav_gazebo/build \
            --install-base /tmp/dynnav_gazebo/install \
            --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark \
            --event-handlers console_direct+

      - name: Test search, plugin discovery, and experiment contracts
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_gazebo/install/setup.bash
          colcon --log-base /tmp/dynnav_gazebo/test-log test \
            --build-base /tmp/dynnav_gazebo/build \
            --install-base /tmp/dynnav_gazebo/install \
            --packages-select dynnav_nav2_cpp dynnav_nav2_benchmark \
            --event-handlers console_direct+
          colcon test-result \
            --test-result-base /tmp/dynnav_gazebo/build \
            --verbose

      - name: Record installed simulation environment
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/dynnav_gazebo/results
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 'ros-jazzy-*' \
            | sort > /tmp/dynnav_gazebo/results/ros_packages.tsv
          uname -a > /tmp/dynnav_gazebo/results/kernel.txt
          gz sim --versions > /tmp/dynnav_gazebo/results/gazebo_versions.txt

      - name: Run paired planner-server benchmark
        run: |
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_gazebo/install/setup.bash
          timeout --signal=INT --kill-after=30s 12m \
            ros2 launch dynnav_nav2_benchmark \
              tb3_static_planner_benchmark.launch.py \
              headless:=true \
              repetitions:=${{ inputs.repetitions || '3' }} \
              output_dir:=/tmp/dynnav_gazebo/results
          test -s /tmp/dynnav_gazebo/results/results.json
          test -s /tmp/dynnav_gazebo/results/trials.csv
          test -s /tmp/dynnav_gazebo/results/map_snapshot.yaml
          test -s /tmp/dynnav_gazebo/results/map_image_snapshot.pgm

      - name: Validate result schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("/tmp/dynnav_gazebo/results/results.json").read_text()
          )
          assert result["schema_version"] == 1
          assert result["benchmark_type"] == "static_compute_path_to_pose"
          assert len(result["summary"]) == 6
          assert len(result["summary_by_scenario"]) == 2
          expected = int("${{ inputs.repetitions || '3' }}") * 2
          assert all(
              item["trials"] == expected for item in result["summary"].values()
          )
          print(json.dumps(result["summary"], indent=2, sort_keys=True))
          PY

      - name: Upload raw benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynnav-jazzy-gazebo-static-planner
          path: /tmp/dynnav_gazebo/results
          if-no-files-found: warn

      - name: Execute live simulated SLAM, map save/reload, AMCL and navigation
        run: |
          set -o pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/dynnav_gazebo/install/setup.bash
          mkdir -p /tmp/dynnav_gazebo/slam_localization
          if ! timeout --signal=INT --kill-after=30s 12m \
            python3 scripts/verify_jazzy_slam_localization.py \
            --output /tmp/dynnav_gazebo/slam_localization 2>&1 \
            | tee /tmp/dynnav_gazebo/slam_localization/probe.log; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/dynnav_gazebo/slam_localization/probe.log').read_text().splitlines()
          for line in lines[-20:]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D'))
          for log in Path('/tmp/dynnav_gazebo/slam_localization').glob('*launch.log'):
              errors = [line for line in log.read_text().splitlines() if 'ERROR' in line or 'Error' in line]
              for line in errors[-8:]:
                  print('::error::' + line.replace('%', '%25').replace('\r', '%0D'))
          result = Path('/tmp/dynnav_gazebo/slam_localization/result.json')
          if result.exists():
              import json
              data = json.loads(result.read_text())
              print('::error::' + str(data.get('error')))
              print('::error::observations: ' + str(data.get('failure_observations')))
          PY
            exit 1
          fi

      - name: Retain live SLAM and localization evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynnav-jazzy-live-slam-amcl
          path: /tmp/dynnav_gazebo/slam_localization
          if-no-files-found: warn
