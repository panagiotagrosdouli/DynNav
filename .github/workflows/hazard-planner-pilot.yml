name: Hazard-aware planner pilot

on:
  pull_request:
    paths:
      - "dynnav/planners/hazard_reliability_astar.py"
      - "dynnav/planners/commitment_aware_astar.py"
      - "dynnav/experiments/hazard_planner_pilot.py"
      - "dynnav/experiments/commitment_trap_benchmark.py"
      - "dynnav/experiments/history_commitment_benchmark.py"
      - "dynnav/commitment_hazard.py"
      - "scripts/run_hazard_planner_pilot.py"
      - "scripts/run_commitment_trap_benchmark.py"
      - "scripts/run_history_commitment_benchmark.py"
      - "tests/test_hazard_reliability_astar.py"
      - "tests/test_hazard_planner_pilot.py"
      - "tests/test_commitment_hazard.py"
      - "tests/test_commitment_aware_astar.py"
      - "tests/test_commitment_trap_benchmark.py"
      - "tests/test_history_commitment_benchmark.py"
      - ".github/workflows/hazard-planner-pilot.yml"
  workflow_dispatch:

concurrency:
  group: hazard-planner-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run planner regression tests
        run: >-
          python -m pytest -q
          tests/test_hazard_reliability_astar.py
          tests/test_hazard_planner_pilot.py
          tests/test_commitment_hazard.py
          tests/test_commitment_aware_astar.py
          tests/test_commitment_trap_benchmark.py
          tests/test_history_commitment_benchmark.py
      - name: Execute development planner pilot
        run: >-
          python scripts/run_hazard_planner_pilot.py
          --seeds 50
          --hazard-count 6
          --reliability-weight 4.0
          --out-dir results/hazard_planner_pilot
      - name: Execute state-only commitment-trap benchmark
        run: >-
          python scripts/run_commitment_trap_benchmark.py
          --out-dir results/commitment_trap
      - name: Execute history-conditioned phase benchmark
        run: >-
          python scripts/run_history_commitment_benchmark.py
          --out-dir results/history_commitment
      - name: Upload raw planner pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hazard-planner-pilot-${{ github.sha }}
          path: |
            results/hazard_planner_pilot
            results/commitment_trap
            results/history_commitment
          if-no-files-found: error
