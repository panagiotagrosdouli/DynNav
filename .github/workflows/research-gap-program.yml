name: Research gap programme

on:
  pull_request:
    paths:
      - "dynnav/**"
      - "scripts/run_research_gap_program.py"
      - "scripts/run_post_full_study_diagnostics.py"
      - "scripts/run_risk_budget_replication.py"
      - "tests/**"
      - "RESEARCH_GAPS_G1_G5.md"
      - ".github/workflows/research-gap-program.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  g1-g5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,researcher]"

      - name: Run focused G1-G5 tests
        run: python -m pytest -q tests/test_research_gap_program.py tests/test_research_gap_runner.py tests/test_robust_commitment_astar.py tests/test_robust_dependence_route_choice.py tests/test_history_compression_exactness.py tests/test_compressed_commitment_astar.py tests/test_extended_research_benchmarks.py tests/test_research_theory_controls.py tests/test_post_full_study_diagnostics.py tests/test_topology_dependence_control.py tests/test_dependence_topology_theory.py tests/test_dependence_connectivity_interaction.py tests/test_risk_budget_learning.py tests/test_empirical_topology_ambiguity.py tests/test_safe_learning_lockout_theory.py tests/test_correlated_gazebo_commissioning.py tests/test_risk_budget_replication.py tests/test_topology_interaction_survey.py tests/test_activation_pomdp_reference.py tests/test_causal_effect_sweep.py

      - name: Run bounded G1-G5 experiment
        run: python scripts/run_research_gap_program.py --trials 2000 --seed 20260925 --output results/research_gap_program/ci_summary.json

      - name: Run exploratory post-full-study diagnostics
        run: python scripts/run_post_full_study_diagnostics.py --opportunities 1000 --seed 20260925 --output results/research_gap_program/post_full_study_diagnostics.json

      - name: Run multi-seed G3 risk-budget replication
        run: python scripts/run_risk_budget_replication.py --opportunities 1000 --repetitions 10 --seed 20260925 --output results/research_gap_program/risk_budget_replication.json

      - name: Upload G1-G5 evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-g5-research-gap-evidence
          path: |
            results/research_gap_program/ci_summary.json
            results/research_gap_program/post_full_study_diagnostics.json
            results/research_gap_program/risk_budget_replication.json
          if-no-files-found: warn
