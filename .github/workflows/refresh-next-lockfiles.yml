# Temporary, one-shot lockfile-generation workflow. Deleted before PR merge.
name: Regenerate patched Next.js lockfiles
on:
  push:
    branches: ["fix/ci-preserve-node-types"]
    paths:
      - ".github/workflows/refresh-next-lockfiles.yml"
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate exact pinned locks without lifecycle scripts
        run: |
          set -eu
          for dir in website apps/web vercel_app; do
            echo "Updating $dir"
            (cd "$dir" && npm install next@16.4.3 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund)
            (cd "$dir" && npm update source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund)
          done
      - name: Confirm lockfiles install and pass the production security gate
        run: |
          set -eu
          for dir in website apps/web vercel_app; do
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done
      - name: Commit generated package and lock files to the PR branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package.json website/package-lock.json apps/web/package.json apps/web/package-lock.json vercel_app/package.json vercel_app/package-lock.json
          if git diff --cached --quiet; then echo "Already current"; exit 0; fi
          git commit -m "fix(security): pin Next.js 16.4.3 and patched source-map-js in web lockfiles"
          git push origin HEAD:fix/ci-preserve-node-types
